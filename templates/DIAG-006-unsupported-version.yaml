id: DIAG-006
name: Unsupported Istio Version
category: version
severity: warning
description: >
  The control plane or istioctl client runs an Istio minor version that is
  outside its support window and no longer receives security fixes. Community
  builds follow the upstream window; Solo distributions of Istio (-solo) follow
  Solo's n-4 window.
rootCause: >
  The mesh has not been upgraded since its minor version reached end of life.
impact: >
  Known CVEs may be unpatched, bug fixes are no longer backported, and newer
  Kubernetes versions may not be tested against this release.
signals:
  # Last verified 2026-10-20.
  # supported: upstream window from istio.io supported-releases (1.29 EOL 2026-10-15,
  #   1.28 EOL 2026-07-01). The weekly "Istio support window" workflow
  #   (scripts/check-istio-support.mjs) fails when this list drifts from istio.io.
  # supportedSolo: "Solo supports n-4 versions for Solo distributions of Istio" and
  #   n-4 patching applies "only with a -solo distribution of Istio, not community
  #   Istio versions" (docs.solo.io/istio/1.31.x/reference/versions/, n = 1.31).
  #   Shift by one minor when Solo ships a new stable minor.
  # Support is judged as of the capture date (BugReportStore.getCaptureInfo: newest log
  # timestamp, else istiod debug log prefix, cluster/events, pod times; info when none):
  # endOfLife and released are istio.io's "End of Life" and "Release Date" columns. Add a
  # minor's end-of-life day when it leaves `supported`, and its release day when it ships;
  # scripts/check-istio-support.mjs reports both when they drift.
  - source:
      type: version_support
      supported: ["1.30", "1.31"]
      supportedSolo: ["1.27", "1.28", "1.29", "1.30", "1.31"]
      endOfLife:
        "1.20": "2024-06-25"
        "1.21": "2024-09-27"
        "1.22": "2025-01-22"
        "1.23": "2025-04-16"
        "1.24": "2025-06-24"
        "1.25": "2025-09-30"
        "1.26": "2025-12-22"
        "1.27": "2026-04-07"
        "1.28": "2026-07-01"
        "1.29": "2026-10-15"
      released:
        "1.20": "2023-11-14"
        "1.21": "2024-03-13"
        "1.22": "2024-05-13"
        "1.23": "2024-08-14"
        "1.24": "2024-11-07"
        "1.25": "2025-03-03"
        "1.26": "2025-05-08"
        "1.27": "2025-08-11"
        "1.28": "2025-11-05"
        "1.29": "2026-02-16"
        "1.30": "2026-05-14"
        "1.31": "2026-08-27"
    check:
      op: exists
remediation:
  - order: 1
    description: "Upgrade the control plane to a supported minor using a canary revision, then migrate workloads"
    command: "istioctl install --set revision=<new-revision>"
    effort: high
    risk: medium
references:
  - "https://istio.io/latest/docs/releases/supported-releases/"
  - "https://docs.solo.io/istio/latest/reference/versions/"
  - "https://istio.io/latest/docs/setup/upgrade/canary/"
enrichmentHints:
  docsQuery: "Istio canary upgrade supported releases"
