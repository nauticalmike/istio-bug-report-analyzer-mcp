id: DIAG-032
name: Severe istioctl analyze Findings
category: config
severity: critical
description: >
  istioctl analyze codes that break or silently change traffic, one line per code with the
  number of messages and resources and a few examples: IST0145 conflicting Gateways, IST0161
  invalid Gateway credential, IST0173 DestinationRule subset selecting no pods, IST0109
  conflicting mesh VirtualService hosts, IST0110 conflicting Sidecars, IST0177 conflicting
  ServiceEntry protocols, IST0152 EnvoyFilter REPLACE misuse, IST0171 negative status
  conditions, IST0123 multiple injection labels (info when its namespaces have no pods),
  IST0175 RequestAuthentication without BLOCKED_CIDRS_IN_JWKS_URIS and IST0106 schema
  validation errors (istiod still serves the object as written; the validating webhook rejects
  it on the next apply). IST0173 is judged on the subset istiod uses: DestinationRules of one
  namespace and host are merged oldest first and the first subset of a name wins, so an empty
  duplicate subset shadowed by an older one is info; it is critical when a VirtualService
  routes traffic (weight unset or above 0) to the empty subset; IST0177 pairs of HTTPS and TLS only are not a conflict (both are
  TLS) and only counted. IST0133 (schema warnings) is split by message: an AuthorizationPolicy
  DENY rule with only HTTP attributes, which denies all TCP traffic, is critical when it is
  mesh-wide (root namespace, no selector) or its selector or targetRef reaches a sidecar or
  gateway pod with a TCP, TLS or other non-HTTP Service port or Gateway server, info when it
  selects no pod or only HTTP ports, and a warning when the dump cannot tell; EnvoyFilter
  strict-parse failures (unknown field, unmarshal) are warnings; a Sidecar workloadSelector
  without labels selects every pod of its namespace and is a warning when it shadows other
  Sidecars (the namespace's selector-less one, newer ones with a selector), which it names,
  else info; ServiceEntry TCP ports without addresses, deprecated
  names and other schema warnings are info; "EnvoyFilter exposes internal implementation details" and "duplicated
  egress host" are only counted. IST0118 is kept only for server-first ports whose Service is
  not in the dump (DIAG-035 reports the others). Each line shows the istioctl analyze level,
  and says so when its severity here differs. The example message is taken from the most
  common message of the line and redacted. Messages on generated objects (ownerReferences,
  the gateway.istio.io/managed label, app.kubernetes.io/managed-by naming a controller or
  operator, or WorkloadEntries and ServiceEntries generated by multicluster peering, named
  autogen.* or autogenflat.*) are collapsed into a count.
  Dual-mode IST0123 is left to DIAG-008 and IST0171 on waypoints to DIAG-012.
rootCause: >
  istioctl analyze reports these as errors or warnings among thousands of routine messages,
  so they are easy to miss.
impact: >
  Depending on the code: TLS listeners without a certificate, 503 UH on subsets with no pods,
  one of two conflicting Gateways or VirtualServices ignored, all TCP traffic to a workload
  denied, or protocol detection stalling server-first connections.
signals:
  - source:
      type: mesh_check
      check: analyze_severe
    check:
      op: exists
remediation:
  - order: 1
    description: "Fix each code at its resources; for collapsed generated resources, change the generator's source configuration instead of the objects"
    command: "istioctl analyze -A --output-threshold Warning"
    effort: low
    risk: low
  - order: 2
    description: "For IST0133 deny-all-TCP, add explicit ports to the DENY rule, or move the HTTP attributes to an ALLOW policy"
    effort: low
    risk: medium
references:
  - "https://istio.io/latest/docs/reference/config/analysis/"
  - "https://istio.io/latest/docs/ops/configuration/security/security-policy-examples/"
