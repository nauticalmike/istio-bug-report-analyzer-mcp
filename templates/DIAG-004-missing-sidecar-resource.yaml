id: DIAG-004
name: Sidecar Proxies Without Sidecar Scoping
category: config
severity: warning
appliesTo:
  - sidecar
  - interop
description: >
  Sidecar proxies in the namespaces listed under Affected are not selected by any Sidecar
  resource, and there is no mesh-wide default Sidecar in the root namespace. Each of those
  proxies receives configuration for every service in the mesh.
rootCause: >
  Sidecar resources have not been created to scope proxy configuration, or only
  workload-scoped ones exist. This is common in initial deployments but problematic at scale.
impact: >
  Proxies consume more memory and CPU. Config push times increase linearly
  with the number of services. In large meshes this causes OOM kills and
  slow convergence.
signals:
  # Coverage per sidecar namespace (sidecar_scope in src/diagnostics/checks.ts):
  # - not evaluated when cluster/crs is missing, empty or unparsed (Sidecars live there);
  # - skipped for meshes under 20 sidecar proxies (SIDECAR_SCOPE_MIN_SIDECARS), counting
  #   only explicit `proxy sidecar` pods, and proxy dirs where the pod dump is partial;
  # - ambient namespaces are left out (a Sidecar resource has no effect there, IST0167);
  # - a selector-less Sidecar in the root namespace covers the whole mesh.
  - source:
      type: sidecar_scope
    check:
      op: exists
remediation:
  - order: 1
    description: >-
      Create a default Sidecar in the root namespace (or one per namespace listed under
      Affected) that limits egress to the namespace itself and the mesh root namespace
      (meshConfig.rootNamespace, istio-system by default, where the control plane runs).
      Before applying it, add every namespace the workloads call: in particular
      egress-gateway namespaces and waypoint namespaces (listed under Affected when the
      archive shows them). Leaving them out sends that traffic to the passthrough or
      blackhole cluster and breaks egress-gateway and sidecar-to-waypoint paths.
    yaml: |
      apiVersion: networking.istio.io/v1
      kind: Sidecar
      metadata:
        name: default
        namespace: istio-system
      spec:
        egress:
          - hosts:
              - "./*"
              - "istio-system/*"   # the root namespace
              # Add the egress-gateway and waypoint namespaces, and any other namespace
              # these workloads call, e.g.:
              # - "istio-egress/*"
              # - "<waypoint-namespace>/*"
    effort: low
    risk: medium
  - order: 2
    description: "Roll it out one namespace at a time (a namespace-level Sidecar overrides the root default) and watch for 502/503 or BlackHoleCluster / PassthroughCluster traffic in access logs and metrics"
    effort: medium
    risk: low
references:
  - "https://istio.io/latest/docs/reference/config/networking/sidecar/"
  - "https://istio.io/latest/docs/ops/configuration/mesh/configuration-scoping/"
enrichmentHints:
  docsQuery: "Sidecar resource scoping best practices"
