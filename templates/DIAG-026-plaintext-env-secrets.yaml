id: DIAG-026
name: Plaintext Credentials in Mesh Workload Environment
category: security
severity: warning
description: >
  istiod, gateway, waypoint or ztunnel containers set an environment variable whose name says
  it holds a credential (LICENSE, TOKEN, SECRET, PASSWORD, KEY, ...) to a literal value that is
  shaped like one (a JWT, a PEM block, a long base64 or hex string), instead of reading it from
  a Secret with valueFrom. Only the workload, container and variable names are shown: the
  value is never read into a finding.
rootCause: >
  A licence key, token or password was pasted into Helm values (or a manifest) as a plain env
  value. It is then stored in the Deployment or DaemonSet spec, in every pod spec, in
  kubectl get -o yaml output and in istioctl bug-report archives.
impact: >
  Anyone who can read the workload spec (much broader than who can read Secrets), or any copy
  of a bug report, has the credential. Rotate it after moving it to a Secret.
signals:
  # plaintext_env_secrets in src/diagnostics/mesh-checks/security-posture.ts:
  # - Deployments, DaemonSets, StatefulSets and Pods of mesh infrastructure (istiod,
  #   gateways, waypoints, ztunnel); application workloads are out of scope;
  # - a Pod is not reported again for a variable its Deployment, DaemonSet or StatefulSet has;
  # - not evaluated without cluster/k8s-resources.
  - source:
      type: mesh_check
      check: plaintext_env_secrets
    check:
      op: exists
remediation:
  - order: 1
    description: >-
      Store the value in a Secret and reference it with valueFrom.secretKeyRef, then rotate
      the credential (it has been exposed in the workload spec).
    yaml: |
      env:
        - name: <VARIABLE>
          valueFrom:
            secretKeyRef:
              name: <secret>
              key: <key>
    effort: low
    risk: low
  - order: 2
    description: >-
      When a Helm chart writes the variable from an inline value, switch to the chart's option
      for reading it from a Secret (or a mounted file), remove the inline value from the chart
      values, then rotate the credential.
    effort: low
    risk: low
references:
  - "https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets-as-environment-variables"
  - "https://istio.io/latest/docs/ops/best-practices/security/"
enrichmentHints:
  docsQuery: "istio license key secret env valueFrom"
