id: DIAG-011
name: Ambient Migration Blockers
category: sidecar-to-ambient
severity: critical
description: >
  The archive shows configuration that ambient mode does not support or treats differently:
  PeerAuthentication port settings istiod drops or DISABLE modes ztunnel treats as PERMISSIVE,
  VM workloads (WorkloadGroups and the WorkloadEntries auto-registered from them), SPIRE as
  the certificate provider, a primary-remote or external control plane, or nodes where
  ztunnel cannot run. Each must be resolved before the affected workloads can move to ambient.
rootCause: >
  Ambient always uses mTLS between mesh workloads (DISABLE accepts plaintext as PERMISSIVE
  does; a selector policy's DISABLE/PERMISSIVE ports become port exemptions when its own mode
  is STRICT, but with its mode unset under an inherited STRICT only PERMISSIVE ports are
  exempt, so a DISABLE port stays STRICT where sidecars accept plaintext),
  carries portLevelMtls only on selector policies outside the root namespace, has no VM data
  plane for istio-agent VMs, does not integrate with upstream SPIRE, supports only
  multi-primary multicluster, and needs a ztunnel and istio-cni pod on every node that runs
  ambient workloads (Linux nodes whose taints the DaemonSets tolerate). WorkloadEntries that
  are HBONE endpoints (networking.istio.io/tunnel=http, ambient.istio.io/redirection=enabled)
  or entries generated by multicluster peering (named autogen.* or autogenflat.*) are
  ambient already and are left out; other hand-written entries are reachable without HBONE.
impact: >
  Migration stalls or breaks: workloads on nodes without ztunnel are not captured (critical
  when ambient pods already run there), remote clusters do not work, and port-level mTLS
  settings that istiod drops leave those ports at the namespace or mesh mode.
signals:
  # ambient_migration_blockers in src/diagnostics/mesh-checks/ambient-policy.ts:
  # - not evaluated without cluster/k8s-resources; without cluster/crs the node, SPIRE and
  #   primary-remote rules still run and an info line says the PeerAuthentication and
  #   WorkloadEntry/WorkloadGroup rules were not evaluated (not evaluated when nothing is found);
  # - nothing at migration stage none (the readiness report lists blockers regardless);
  # - PeerAuthentication: DISABLE, honored port exemptions and portLevelMtls on a selector-less
  #   or root-namespace policy (never honored, by sidecars either) are info; a port DISABLE on
  #   a policy with mtls.mode unset under a STRICT namespace or mesh policy and no PERMISSIVE
  #   port stays STRICT in ambient (convertedSelectorPeerAuthentications): critical on ambient
  #   pods, warning (migration blocker) on sidecars; PERMISSIVE/DISABLE ports with the mode
  #   unset under a namespace policy whose own mode is UNSET convert to no ztunnel policy at
  #   all (STRICT is lost): warning;
  # - node checks need cluster/nodes; without a ztunnel DaemonSet the chart's default
  #   tolerations and Linux nodeSelector are assumed; nodes with the same blocker and no
  #   ambient pod share a line; node affinity is not modelled.
  - source:
      type: mesh_check
      check: ambient_migration_blockers
    check:
      op: exists
remediation:
  - order: 1
    description: >-
      Replace PeerAuthentication DISABLE with PERMISSIVE where plaintext clients must still
      connect (a port DISABLE under an inherited STRICT stays STRICT in ambient: make it
      PERMISSIVE or set the policy's mtls.mode STRICT), and move port-level settings to a policy with a selector outside the root
      namespace (the only place istiod reads portLevelMtls); keep VM-backed, SPIRE-issued and
      remote-cluster workloads in sidecar mode until ambient supports them.
    effort: medium
    risk: low
  - order: 2
    description: >-
      Make ztunnel and istio-cni schedulable on every node that will run ambient workloads (add
      tolerations for the node taints, widen the nodeSelector), or keep workloads on Windows,
      serverless and virtual nodes out of ambient namespaces (istio.io/dataplane-mode=none).
    effort: medium
    risk: medium
references:
  - "https://istio.io/latest/docs/ambient/migrate/"
  - "https://istio.io/latest/docs/ambient/install/platform-prerequisites/"
enrichmentHints:
  docsQuery: "ambient mode not supported VM SPIRE primary-remote"
