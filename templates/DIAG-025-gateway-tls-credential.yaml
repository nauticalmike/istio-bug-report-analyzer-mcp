id: DIAG-025
name: Gateway TLS Credential Missing, Invalid or Refused
category: security
severity: critical
description: >
  A gateway's TLS certificate cannot be served: istiod's SDS cannot read the Secret, the
  certificate is expired or not yet valid, the private key does not match the certificate,
  istiod refuses a cross-namespace reference, or an istio Gateway credentialName or a
  Gateway API certificateRef names a Secret that is not in cluster/secrets (names only:
  secret contents are never read).
rootCause: >
  istiod resolves an istio Gateway's credentialName (name, or namespace/name) in the
  namespace of the gateway pods and serves only Secrets of that namespace; a Gateway API
  certificateRef is read from the Gateway's namespace, or from another namespace only with
  a ReferenceGrant there. A missing, misnamed, expired or mismatched Secret leaves the
  listener without a certificate.
impact: >
  The HTTPS listener serves no certificate, or Envoy rejects the listener update (a bad key
  NACKs the whole LDS update, so every route of the gateway freezes at its last good
  config) and new gateway replicas start with nothing. Clients see TLS handshake failures.
signals:
  # gateway_tls_credential in src/diagnostics/mesh-checks/security-certs.ts:
  # - log rules on istiod and proxy logs; cross-check of Gateways (cluster/crs) against
  #   cluster/secrets (names), for gateway pods found in the pod dump;
  # - a missing Secret is only reported when its namespace was collected and appears in the
  #   cluster/secrets listing; an empty or unrecognized listing, or one without the NAMESPACE
  #   column, leaves that cross-check not evaluated (cross-namespace checks still run);
  # - a failing <name>-cacert Secret is folded into its base Secret's line; a Secret named by a
  #   DestinationRule credentialName is worded as TLS origination, not a listener certificate;
  # - not evaluated when Secrets are needed but cluster/secrets is missing, or when neither
  #   logs nor cluster/crs are in the archive.
  - source:
      type: mesh_check
      check: gateway_tls_credential
    check:
      op: exists
remediation:
  - order: 1
    description: >-
      Create (or rename) the Secret in the gateway pods' namespace (istio Gateway) or the
      Gateway's namespace (Gateway API), with tls.crt and tls.key, and check its validity:
      kubectl -n <ns> get secret <name> -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl
      x509 -noout -dates -subject.
    effort: low
    risk: low
  - order: 2
    description: >-
      For a Gateway API certificateRef in another namespace, add a ReferenceGrant in the
      Secret's namespace that allows Gateways from the Gateway's namespace to read Secrets.
    yaml: |
      apiVersion: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      metadata:
        name: allow-gateway-certs
        namespace: <secret-namespace>
      spec:
        from:
          - group: gateway.networking.k8s.io
            kind: Gateway
            namespace: <gateway-namespace>
        to:
          - group: ""
            kind: Secret
    effort: low
    risk: low
  - order: 3
    description: >-
      Alert on pilot_total_xds_rejects{type=~".*Secret|.*Listener"} and
      pilot_sds_certificate_errors_total so a bad certificate is caught before it freezes a
      gateway.
    effort: low
    risk: low
references:
  - "https://istio.io/latest/docs/tasks/traffic-management/ingress/secure-ingress/"
  - "https://gateway-api.sigs.k8s.io/api-types/referencegrant/"
enrichmentHints:
  docsQuery: "istio gateway credentialName secret not found SDS"
