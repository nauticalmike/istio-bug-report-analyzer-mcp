name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No dependency cache in the release job: a poisoned cache would ship in the package.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # setup-node enables caching automatically when devEngines names npm; keep the release job cache-free.
          package-manager-cache: false
      # npm 10 crashes in arborist (#loadPeerSet) on this tree; package.json devEngines requires >=11.21.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
